          set -euo pipefail
          cc -I Source tests/gpslab_scheduler_test.c Source/GPSLabSchedulerCore.c \
            Source/GPSLabProfileCore.c -o /tmp/gpslab_scheduler_test
          /tmp/gpslab_scheduler_test

  scheduler-tests:
