        run: |
          set -euo pipefail
          cc -I Source tests/gpslab_search_layout_test.c Source/GPSLabSearchLayoutCore.c \
            -o /tmp/gpslab_search_layout_test
          /tmp/gpslab_search_layout_test

  profile-core-tests:
    name: Profile schema core (portable C)
    runs-on: ubuntu-22.04
