          clang -fobjc-arc -fmodules -framework Foundation -framework CoreLocation -ISource \
            tests/GPSLabProfileApplicationTests.m Source/GPSLabProfileApplicationCoordinator.m \
            Source/GPSLabProfile.m Source/GPSLabProfileCore.c Source/GPSLabSimulationRegistry.m \
            Source/GPSLabSimulationModule.m Source/GPSLabWiFiSimulationModule.m \
            Source/GPSLabBluetoothSimulationModule.m -o /tmp/gpslab-application-tests
          /tmp/gpslab-application-tests

  simulation-module-tests:
