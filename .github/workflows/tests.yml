            tests/GPSLabSchedulerTests.m Source/GPSLabScheduler.m Source/GPSLabSchedulerCore.c \
            Source/GPSLabProfile.m Source/GPSLabProfileCore.c -o /tmp/gpslab-scheduler-tests
          /tmp/gpslab-scheduler-tests
