      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run profile Foundation tests
        shell: bash
        run: |
          set -euo pipefail
          clang -fobjc-arc -fmodules -framework Foundation -framework CoreLocation -ISource \
            tests/GPSLabProfileTests.m Source/GPSLabProfile.m Source/GPSLabProfileStore.m \
            Source/GPSLabProfileCore.c -o /tmp/gpslab-profile-tests
