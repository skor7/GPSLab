    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the generated header is in sync with the manifest
        shell: bash
        run: python3 scripts/gen_protected_strings.py --check

      - name: Compile and run portable protected-string tests
        shell: bash
        run: |
          set -euo pipefail
          cc -I Source tests/gpslab_protected_strings_test.c Source/GPSLabProtectedStringCore.c \
