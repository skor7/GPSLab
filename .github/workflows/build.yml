name: Build GPSLab

on:
  push:
    paths:
      - 'Source/**'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Source/**'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Static validation (clean-room, ARC, Makefile)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run static validation
        shell: bash
        run: bash scripts/validate.sh

      - name: Audit both build modes (dev + production)
        shell: bash
        run: bash scripts/audit_build_modes.sh

      - name: Run release-protection static checks
        shell: bash
        run: bash scripts/release_protection.sh

      - name: Run KeychainFix release-script self-check
        shell: bash
        run: bash scripts/keychainfix_release.sh --self-check

  build:
    name: Production build + audit (macOS, arm64, iOS 16+)
    runs-on: macos-latest
    needs: static
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Theos on a macOS runner uses the host Xcode toolchain and a Homebrew GNU
      # make. The action's macOS branch runs `brew install ldid make`, but its
      # `PATH=... >> $GITHUB_ENV` line is a no-op (an assignment with a
      # redirection, not an echo), so GNU make is NOT actually put on PATH by the
      # action. We add it explicitly via $GITHUB_PATH below. The action is pinned
      # to the v1 commit so CI cannot silently pick up different behaviour.
      #
      # Verified from the action source (Randomblock1/theos-action@v1 action.yml):
      #   * macOS branch: `brew install ldid make`; no Linux toolchain is fetched.
      #   * Theos is git-cloned, and `theos/sdks@master` is cloned into $THEOS/sdks.
      #   * theos/sdks@master ships up to iPhoneOS16.5.sdk, so an iOS 16+ SDK is
      #     present without the Xcode fallback.
      - name: Set up Theos (macOS toolchain)
        uses: Randomblock1/theos-action@4e23d15886bca77b5f7c462a82567e0de33ebe0b  # v1
        with:
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Ensure Homebrew GNU make is on PATH
        shell: bash
        run: |
          set -euo pipefail
          make_bin="$(brew --prefix make)/libexec/gnubin"
          echo "$make_bin" >> "$GITHUB_PATH"
          echo "GNU make: $("$make_bin/make" --version | head -1)"

      - name: Ensure an iOS 16+ SDK is available to Theos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          shopt -s nullglob
          sdks=("$THEOS"/sdks/iPhoneOS*.sdk)
          echo "Theos SDKs before: ${sdks[*]:-none}"
          best=""
          for sdk in "${sdks[@]}"; do
            ver="$(basename "$sdk" | sed -E 's/^iPhoneOS([0-9]+).*/\1/')"
            if [[ "$ver" =~ ^[0-9]+$ ]] && (( ver >= 16 )); then best="$sdk"; fi
          done
          if [[ -z "$best" ]]; then
            # Name the symlink from the SDK *version* so it matches the
            # `iPhoneOS<major>*.sdk` glob (basename can be the generic
            # `iPhoneOS.sdk`, which carries no version and would be ignored).
            xcode_sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
            xcode_ver="$(xcrun --sdk iphoneos --show-sdk-version)"
            echo "No Theos SDK >= 16; linking the Xcode SDK $xcode_ver: $xcode_sdk"
            ln -sfn "$xcode_sdk" "$THEOS/sdks/iPhoneOS${xcode_ver}.sdk"
          fi
          found=0
          for sdk in "$THEOS"/sdks/iPhoneOS*.sdk; do
            ver="$(basename "$sdk" | sed -E 's/^iPhoneOS([0-9]+).*/\1/')"
            if [[ "$ver" =~ ^[0-9]+$ ]] && (( ver >= 16 )); then found=1; fi
          done
          if (( found != 1 )); then
            echo "::error::no iOS 16+ SDK found for Theos"
            ls -la "$THEOS/sdks" || true
            exit 1
          fi
          ls -d "$THEOS"/sdks/iPhoneOS*.sdk

      - name: Verify the iOS 16+ SDK used by the build
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=()
          for sdk in "$THEOS"/sdks/iPhoneOS*.sdk; do
            ver="$(basename "$sdk" | sed -E 's/^iPhoneOS([0-9]+).*/\1/')"
            if [[ "$ver" =~ ^[0-9]+$ ]] && (( ver >= 16 )); then candidates+=("$sdk"); fi
          done
          if (( ${#candidates[@]} == 0 )); then
            echo "::error::no iOS 16+ SDK selected"
            ls -la "$THEOS/sdks" || true
            exit 1
          fi
          sdk_dir="$(printf '%s\n' "${candidates[@]}" | sort -V | tail -1)"
          echo "Selected SDK: $sdk_dir"
          /usr/libexec/PlistBuddy -c 'Print :Version' "$sdk_dir/SDKSettings.plist" 2>/dev/null || true

      # ------------------------------------------------------------------
      # DEV baseline (readable/debuggable). This is the "before" artifact.
      # ------------------------------------------------------------------
      - name: Build DEV baseline (explicitly selected)
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make MODE=dev
          built="$(find .theos -type f -name 'GPSLab.dylib' -print -quit)"
          [[ -n "$built" ]] || { echo "::error::DEV build produced no GPSLab.dylib"; exit 1; }
          cp "$built" "$RUNNER_TEMP/GPSLab-dev.dylib"
          echo "DEV dylib: $built"

      - name: Audit DEV baseline (symbols + strings)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_macho.py "$RUNNER_TEMP/GPSLab-dev.dylib" --json > "$RUNNER_TEMP/dev-audit.json"
          python3 - "$RUNNER_TEMP/dev-audit.json" <<'PY'
          import json, sys
          a = json.load(open(sys.argv[1]))
          print("DEV: sha256=%s size=%s symbols_local=%s symbols_stab_source=%s strings=%s leaks=%s" % (
              a["sha256"], a["size_bytes"], a["symbols"]["local"], a["symbols"]["stab_source"],
              a["string_count"], sorted(a.get("leaks", {}))))
          PY

      # ------------------------------------------------------------------
      # PRODUCTION artifact (hardened).
      # ------------------------------------------------------------------
      - name: Build PRODUCTION (explicitly selected)
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make MODE=production
          built="$(find .theos -type f -name 'GPSLab.dylib' -print -quit)"
          [[ -n "$built" ]] || { echo "::error::PRODUCTION build produced no GPSLab.dylib"; exit 1; }
          cp "$built" "$GITHUB_WORKSPACE/GPSLab.dylib"
          echo "PRODUCTION dylib: $built"

      - name: Release-protection gate (stripped, leak-free, protected strings)
        shell: bash
        run: bash scripts/release_protection.sh "$GITHUB_WORKSPACE/GPSLab.dylib"

      - name: Audit PRODUCTION (arm64/iOS16/install_name/deps/debug/secret scan + report)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_macho.py "$GITHUB_WORKSPACE/GPSLab.dylib" --json > "$RUNNER_TEMP/prod-audit.json"
          python3 scripts/ci_production_report.py \
            --dev-audit "$RUNNER_TEMP/dev-audit.json" \
            --prod-audit "$RUNNER_TEMP/prod-audit.json" \
            --binary "$GITHUB_WORKSPACE/GPSLab.dylib" \
            --out-json "$GITHUB_WORKSPACE/GPSLab-production-report.json" \
            --out-md "$GITHUB_WORKSPACE/GPSLab-production-report.md"

      - name: Publish the report to the workflow summary
        if: always()
        shell: bash
        run: |
          if [[ -f "$GITHUB_WORKSPACE/GPSLab-production-report.md" ]]; then
            cat "$GITHUB_WORKSPACE/GPSLab-production-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Build the CI-updated RELEASE_PROTECTION_REPORT.md as a CI artifact only:
      # it is the tracked baseline report plus an appended, CI-verified section.
      # The generated file is gitignored and is NEVER committed.
      - name: Assemble CI-updated RELEASE_PROTECTION_REPORT.md
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          baseline="$GITHUB_WORKSPACE/RELEASE_PROTECTION_REPORT.md"
          out="$GITHUB_WORKSPACE/RELEASE_PROTECTION_REPORT.ci.md"
          if [[ ! -f "$baseline" ]]; then
            echo "::error::tracked baseline report RELEASE_PROTECTION_REPORT.md is missing"
            exit 1
          fi
          cp "$baseline" "$out"
          {
            echo ""
            echo "---"
            echo ""
            echo "## CI-verified run (generated artifact — not committed)"
            echo ""
            echo "- Generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo ""
            echo "The section below is the machine-generated production report for THIS run."
            echo "Its DEV/PRODUCTION hashes, sizes, exported-symbol counts, secret scan and"
            echo "sensitive-string binary-audit verdict are read from the actual built artifacts."
            echo ""
            if [[ -f "$GITHUB_WORKSPACE/GPSLab-production-report.md" ]]; then
              cat "$GITHUB_WORKSPACE/GPSLab-production-report.md"
            else
              echo "_Production report not available for this run._"
            fi
            echo ""
            echo "### Device / runtime verification: NOT VERIFIED"
            echo ""
            echo "CI proves the static build and artifact contract only. Loading the dylib on a"
            echo "device/simulator and exercising its runtime behaviour are NOT performed in CI and"
            echo "remain UNVERIFIED until an operator completes the steps in §5 of the baseline report."
          } >> "$out"
          echo "Wrote $out"

      - name: Upload the production dylib (production output only)
        uses: actions/upload-artifact@v4
        with:
          name: GPSLab-production-dylib
          path: GPSLab.dylib
          if-no-files-found: error
          retention-days: 14

      - name: Upload the machine-readable + Markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GPSLab-production-report
          path: |
            GPSLab-production-report.json
            GPSLab-production-report.md
            RELEASE_PROTECTION_REPORT.ci.md
          if-no-files-found: warn
          retention-days: 14
